name: Sync WinGet manifests

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: winget-pkgs-manifest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out workflow and synchronizer
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true

      - name: Set up Python and cache dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-sync.txt

      - name: Install synchronizer dependency
        run: python -m pip install -r scripts/requirements-sync.txt

      - name: Apply upstream diff to manifests branch
        id: sync
        env:
          CATALOG_BRANCH: manifests
          UPSTREAM_REPOSITORY: microsoft/winget-pkgs
          UPSTREAM_REF: master
          MAX_UPSTREAM_COMMITS_PER_RUN: "500"
        run: python scripts/sync_winget_pkgs.py

      - name: Solicitar índice da atualização publicada
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_COMMIT: ${{ steps.sync.outputs.catalog_commit }}
        run: |
          set -euo pipefail
          if [[ -z "$CATALOG_COMMIT" ]]; then
            CATALOG_COMMIT="$(git ls-remote origin refs/heads/manifests | cut -f1)"
          fi
          [[ "$CATALOG_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run catalog-sqlite.yml --ref main -f source_commit="$CATALOG_COMMIT"
